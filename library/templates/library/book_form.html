<h1>{% if book %}Edit Book{% else %}Add Book{% endif %}</h1>

<form method="POST">
    {% csrf_token %}

    <label>Title:</label>
    <input type="text" name="title"
           value="{{ book.title|default:'' }}" required>
    <br><br>

    <label>Author:</label>
    <input type="text" name="author"
           value="{{ book.author|default:'' }}" required>
    <br><br>

    <label>Published Year:</label>
    <input type="number" name="published_year"
           value="{{ book.published_year|default:'' }}">
    <br><br>

    <label>Genre:</label>
    <input type="text" name="genre"
           value="{{ book.genre|default:'' }}">
    <br><br>

    <label>
        <input type="checkbox" name="is_available"
               {% if book.is_available or not book %}checked{% endif %}>
        Available
    </label>
    <br><br>

    <button type="submit">Save Book</button>
    <a href="{% url 'book-list' %}">Cancel</a>
</form>
