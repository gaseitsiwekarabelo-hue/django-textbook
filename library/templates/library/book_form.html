<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
            color: #333;
        }

        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        form p {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="number"] {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="checkbox"] {
            margin-top: 10px;
        }

        label {
            font-weight: bold;
        }

        .errorlist {
            color: #c0392b;
            padding-left: 20px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .button:hover {
            background-color: #555;
        }

        .cancel-button {
            background-color: #777;
        }

        .cancel-button:hover {
            background-color: #555;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>{{ title }}</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="button">
                    {{ submit_text|default:"Save Book" }}
                </button>

                <a href="{% url 'library:book_list' %}"
                   class="button cancel-button">
                    Cancel
                </a>
            </div>
        </form>

    </div>

</body>
</html>
